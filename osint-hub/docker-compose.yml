version: "3.8"

services:
  osint-hub:
    build: .
    container_name: osint-hub
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - OSINT_HOME=/opt
      - PORT=8080
      - HOST=0.0.0.0
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - KIMI_MODEL=${KIMI_MODEL:-kimi-k2}
    volumes:
      - osint-data:/opt/osint-hub/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/tools"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  osint-data:
