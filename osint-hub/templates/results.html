{% extends "base.html" %}
{% block title %}OSINT Hub V5 - Results{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-white">Scan Results</h2>
        <div class="flex gap-3">
            <button onclick="toggleAllDropdowns()" class="px-4 py-2 bg-gray-800/60 text-gray-300 border border-gray-700/50 rounded-lg hover:bg-gray-700/60 transition text-sm">
                Expand / Collapse All
            </button>
            <button onclick="exportJSON()" class="px-4 py-2 bg-purple-900/40 text-purple-400 border border-purple-900/50 rounded-lg hover:bg-purple-900/60 transition text-sm">
                Export JSON
            </button>
            <button onclick="location.href='/scan'" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-red-500 text-white rounded-lg hover:opacity-90 transition text-sm">
                New Scan
            </button>
        </div>
    </div>

    <div id="results-loading" class="text-center py-20">
        <p class="text-gray-500">Loading results...</p>
    </div>

    <div id="results-content" style="display:none">
        <!-- Seeds -->
        <div class="card rounded-lg p-5 mb-6">
            <h3 class="text-lg font-semibold text-white mb-3">Target Seeds</h3>
            <div id="seeds-display" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Summary Stats -->
        <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6" id="summary-stats"></div>

        <!-- Findings -->
        <div id="results-findings" class="space-y-4"></div>

        <!-- Recommendations -->
        <div id="recommendations-section" class="card rounded-lg p-5 mt-6" style="display:none">
            <h3 class="text-lg font-semibold text-white mb-3">Suggested Next Steps</h3>
            <div id="recommendations-list" class="space-y-2"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
    .finding-row { cursor: pointer; transition: all 0.15s ease; }
    .finding-row:hover { background: rgba(83, 52, 131, 0.15) !important; }
    .finding-details { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
    .finding-details.open { max-height: 800px; padding-top: 0.75rem; }
    .chevron { transition: transform 0.2s ease; display: inline-block; }
    .chevron.open { transform: rotate(90deg); }
    .meta-table td { padding: 0.25rem 0.75rem 0.25rem 0; vertical-align: top; }
    .meta-key { color: #9ca3af; white-space: nowrap; }
    .meta-val { color: #e5e7eb; word-break: break-all; }
</style>
<script>
const CATEGORY_CONFIG = {
    social_profile: { label: 'Social Profiles', color: 'text-cyber-blue', icon: '&#127760;' },
    registered_site: { label: 'Registered Sites', color: 'text-cyan-400', icon: '&#128274;' },
    leaked_credential: { label: 'Leaked Credentials', color: 'text-red-500', icon: '&#128272;' },
    breach: { label: 'Data Breaches', color: 'text-cyber-red', icon: '&#9888;' },
    password_hash: { label: 'Password Hashes', color: 'text-red-400', icon: '&#128273;' },
    email: { label: 'Emails', color: 'text-purple-400', icon: '&#9993;' },
    related_email: { label: 'Related Emails', color: 'text-purple-300', icon: '&#9993;' },
    username: { label: 'Usernames', color: 'text-cyber-green', icon: '&#128100;' },
    related_username: { label: 'Related Usernames', color: 'text-green-300', icon: '&#128100;' },
    phone: { label: 'Phones', color: 'text-yellow-400', icon: '&#128222;' },
    related_phone: { label: 'Related Phones', color: 'text-yellow-300', icon: '&#128222;' },
    full_name: { label: 'Names', color: 'text-white', icon: '&#128101;' },
    location: { label: 'Locations', color: 'text-orange-400', icon: '&#128205;' },
    photo_url: { label: 'Photos', color: 'text-pink-400', icon: '&#128247;' },
    domain: { label: 'Domains', color: 'text-teal-400', icon: '&#127760;' },
    related_domain: { label: 'Related Domains', color: 'text-teal-300', icon: '&#127760;' },
    subdomain: { label: 'Subdomains', color: 'text-teal-200', icon: '&#127760;' },
    ip_address: { label: 'IP Addresses', color: 'text-gray-300', icon: '&#128421;' },
    organization: { label: 'Organizations', color: 'text-blue-300', icon: '&#127970;' },
    dark_web_mention: { label: 'Dark Web Mentions', color: 'text-amber-400', icon: '&#128065;' },
    code_repository: { label: 'Code Repositories', color: 'text-lime-400', icon: '&#128187;' },
    forum_post: { label: 'Forum Posts', color: 'text-sky-400', icon: '&#128172;' },
    paste: { label: 'Pastes & Dumps', color: 'text-orange-400', icon: '&#128196;' },
    archived_page: { label: 'Archived Pages', color: 'text-violet-400', icon: '&#128214;' },
    document_url: { label: 'Documents', color: 'text-indigo-400', icon: '&#128196;' },
    dns_record: { label: 'DNS Records', color: 'text-emerald-400', icon: '&#128268;' },
    certificate: { label: 'Certificates', color: 'text-emerald-300', icon: '&#128274;' },
    public_record: { label: 'Public Records', color: 'text-rose-400', icon: '&#128220;' },
    web_mention: { label: 'Web Mentions', color: 'text-slate-300', icon: '&#128269;' },
    messaging_profile: { label: 'Messaging Profiles', color: 'text-fuchsia-400', icon: '&#128172;' },
    employer: { label: 'Employers', color: 'text-amber-300', icon: '&#127970;' },
    education: { label: 'Education', color: 'text-blue-300', icon: '&#127891;' },
    address: { label: 'Addresses', color: 'text-rose-300', icon: '&#127968;' },
    technology: { label: 'Technologies', color: 'text-cyan-300', icon: '&#9881;' },
    bio: { label: 'Bios', color: 'text-gray-300', icon: '&#128221;' },
    raw: { label: 'Raw Intelligence', color: 'text-gray-400', icon: '&#128196;' },
};

const CATEGORY_ORDER = [
    'leaked_credential', 'password_hash', 'breach',
    'dark_web_mention', 'social_profile', 'messaging_profile',
    'registered_site', 'code_repository', 'paste', 'forum_post',
    'email', 'related_email', 'username', 'related_username',
    'phone', 'related_phone', 'full_name', 'photo_url',
    'archived_page', 'document_url', 'public_record', 'web_mention',
    'location', 'address', 'employer', 'organization', 'education',
    'domain', 'related_domain', 'subdomain', 'dns_record', 'certificate',
    'ip_address', 'technology', 'bio', 'raw',
];

let scanResults = null;
let allExpanded = false;

function loadResults() {
    Promise.all([
        fetch('/api/scan/results').then(r => r.json()),
        fetch('/api/scan/recommendations').then(r => r.json()),
    ]).then(([results, recs]) => {
        scanResults = results;
        if (!results || !results.total_findings) {
            document.getElementById('results-loading').innerHTML = '<p class="text-gray-500">No scan results yet. <a href="/scan" class="text-purple-400 hover:underline">Start a scan</a></p>';
            return;
        }
        document.getElementById('results-loading').style.display = 'none';
        document.getElementById('results-content').style.display = 'block';
        renderSeeds(results.seeds);
        renderSummary(results);
        renderFindings(results.findings_by_type);
        if (recs && recs.length > 0) renderRecommendations(recs);
    });
}

function renderSeeds(seeds) {
    const container = document.getElementById('seeds-display');
    for (const [key, val] of Object.entries(seeds || {})) {
        if (!val) continue;
        container.innerHTML += `<span class="px-3 py-1.5 rounded-lg bg-purple-900/30 border border-purple-800/30 mono text-sm">
            <span class="text-gray-500">${key}:</span> <span class="text-white">${val}</span>
        </span>`;
    }
}

function renderSummary(results) {
    const fbt = results.findings_by_type || {};
    const stats = [
        { label: 'Total Findings', value: results.total_findings, color: 'text-cyber-green' },
        { label: 'Tools Run', value: results.total_tool_runs, color: 'text-cyber-blue' },
        { label: 'Profiles', value: (fbt.social_profile || []).length, color: 'text-purple-400' },
        { label: 'Breaches', value: (fbt.breach || []).length, color: 'text-cyber-red' },
        { label: 'Credentials', value: (fbt.leaked_credential || []).length, color: 'text-red-500' },
        { label: 'Sites', value: (fbt.registered_site || []).length, color: 'text-cyan-400' },
    ];
    const container = document.getElementById('summary-stats');
    for (const stat of stats) {
        container.innerHTML += `<div class="card rounded-lg p-4 text-center">
            <div class="text-3xl font-bold ${stat.color} mono">${stat.value}</div>
            <div class="text-xs text-gray-500 mt-1">${stat.label}</div>
        </div>`;
    }
}

function toggleDropdown(id) {
    const el = document.getElementById('details-' + id);
    const chevron = document.getElementById('chevron-' + id);
    if (el) {
        el.classList.toggle('open');
        if (chevron) chevron.classList.toggle('open');
    }
}

function toggleAllDropdowns() {
    allExpanded = !allExpanded;
    document.querySelectorAll('.finding-details').forEach(el => {
        if (allExpanded) el.classList.add('open');
        else el.classList.remove('open');
    });
    document.querySelectorAll('.chevron').forEach(el => {
        if (allExpanded) el.classList.add('open');
        else el.classList.remove('open');
    });
}

function renderMetaTable(meta) {
    if (!meta || Object.keys(meta).length === 0) return '<span class="text-gray-600 text-xs">No additional data</span>';
    let html = '<table class="meta-table text-xs mono w-full">';
    for (const [key, val] of Object.entries(meta)) {
        let displayVal;
        if (typeof val === 'object' && val !== null) {
            displayVal = '<pre class="text-xs text-gray-300 whitespace-pre-wrap">' + escapeHtml(JSON.stringify(val, null, 2)) + '</pre>';
        } else if (typeof val === 'boolean') {
            displayVal = val ? '<span class="text-green-400">true</span>' : '<span class="text-red-400">false</span>';
        } else {
            displayVal = escapeHtml(String(val));
        }
        // Make URLs clickable in values
        if (typeof val === 'string' && val.startsWith('http')) {
            displayVal = `<a href="${escapeHtml(val)}" target="_blank" class="text-purple-400 hover:underline">${escapeHtml(val)}</a>`;
        }
        // Highlight sensitive fields
        const isSensitive = ['password', 'password_hash', 'credential'].includes(key);
        const valClass = isSensitive ? 'text-red-400' : 'meta-val';
        html += `<tr><td class="meta-key">${escapeHtml(key)}</td><td class="${valClass}">${displayVal}</td></tr>`;
    }
    html += '</table>';
    return html;
}

function renderFindings(fbt) {
    const container = document.getElementById('results-findings');
    const sortedTypes = Object.keys(fbt).sort((a, b) => {
        const orderA = CATEGORY_ORDER.indexOf(a);
        const orderB = CATEGORY_ORDER.indexOf(b);
        if (orderA !== -1 && orderB !== -1) return orderA - orderB;
        if (orderA !== -1) return -1;
        if (orderB !== -1) return 1;
        return (fbt[b] || []).length - (fbt[a] || []).length;
    });

    let globalIdx = 0;
    for (const ftype of sortedTypes) {
        const items = fbt[ftype];
        if (!items || items.length === 0) continue;
        const config = CATEGORY_CONFIG[ftype] || { label: ftype, color: 'text-gray-400', icon: '&#128196;' };

        let html = `<div class="card rounded-lg p-5">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold ${config.color}"><span class="mr-2">${config.icon}</span>${config.label}</h3>
                <span class="mono text-sm ${config.color}">${items.length}</span>
            </div>
            <div class="space-y-1">`;

        for (const item of items) {
            const idx = globalIdx++;
            const isUrl = (item.value || '').startsWith('http');
            const confidence = Math.round((item.confidence || 0) * 100);
            const meta = item.metadata || {};
            const confidenceColor = confidence > 80 ? 'bg-green-500' : confidence > 50 ? 'bg-yellow-500' : 'bg-gray-600';
            const metaCount = Object.keys(meta).length;

            // Quick summary from metadata
            let quickMeta = '';
            if (meta.site) quickMeta += `<span class="text-gray-500">${escapeHtml(meta.site)}</span> `;
            if (meta.username) quickMeta += `<span class="text-green-400">@${escapeHtml(meta.username)}</span> `;
            if (meta.password) quickMeta += `<span class="text-red-400">pw exposed</span> `;
            if (meta.password_exposed) quickMeta += `<span class="text-red-500 font-bold">PW EXPOSED</span> `;
            if (meta.registration_confirmed) quickMeta += `<span class="text-cyan-400">registered</span> `;

            html += `<div class="rounded-lg bg-dark-900/50 border border-gray-800/50 overflow-hidden">
                <div class="finding-row flex items-center justify-between p-3" onclick="toggleDropdown(${idx})">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <span class="chevron text-gray-500 text-xs flex-shrink-0" id="chevron-${idx}">&#9654;</span>
                        ${isUrl ? `<a href="${item.value}" target="_blank" onclick="event.stopPropagation()" class="mono text-sm ${config.color} hover:underline break-all">${item.value}</a>`
                               : `<span class="mono text-sm text-gray-200 break-all">${escapeHtml(item.value)}</span>`}
                    </div>
                    <div class="flex items-center gap-3 ml-4 flex-shrink-0">
                        <div class="text-xs">${quickMeta}</div>
                        <span class="text-xs text-gray-600">${item.source_tool}</span>
                        <div class="w-12 bg-dark-800 rounded-full h-1.5">
                            <div class="h-1.5 rounded-full ${confidenceColor}" style="width:${confidence}%"></div>
                        </div>
                        <span class="mono text-xs text-gray-500">${confidence}%</span>
                        <span class="mono text-xs text-gray-600">${metaCount} fields</span>
                    </div>
                </div>
                <div class="finding-details px-3 pb-3 border-t border-gray-800/30" id="details-${idx}">
                    <div class="mt-2 p-3 rounded bg-dark-800/50">
                        <div class="text-xs text-gray-500 mb-2 flex items-center gap-4">
                            <span>Source: <span class="text-purple-400">${item.source_tool}</span></span>
                            <span>Confidence: <span class="${confidence > 80 ? 'text-green-400' : confidence > 50 ? 'text-yellow-400' : 'text-gray-400'}">${confidence}%</span></span>
                            <span>Type: <span class="text-cyan-400">${ftype}</span></span>
                            ${item.id ? `<span>ID: <span class="text-gray-600">${escapeHtml(String(item.id).substring(0,8))}</span></span>` : ''}
                        </div>
                        ${renderMetaTable(meta)}
                    </div>
                </div>
            </div>`;
        }
        html += '</div></div>';
        container.innerHTML += html;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

function renderRecommendations(recs) {
    const section = document.getElementById('recommendations-section');
    const container = document.getElementById('recommendations-list');
    section.style.display = 'block';
    for (const rec of recs.slice(0, 10)) {
        container.innerHTML += `<div class="flex items-center justify-between py-2 px-3 rounded bg-purple-900/10 border border-purple-900/20">
            <span class="text-sm text-gray-300">${rec.reason}</span>
            <span class="mono text-xs text-purple-400">${rec.tool}</span>
        </div>`;
    }
}

function exportJSON() {
    if (!scanResults) return;
    const blob = new Blob([JSON.stringify(scanResults, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `osint-report-${scanResults.id || 'scan'}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

loadResults();
</script>
{% endblock %}
